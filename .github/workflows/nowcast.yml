name: nowcast

# Run one pipeline cycle and deploy the static site to GitHub Pages.
# Precompute artifacts (operational/state/attrs_L*.csv, pixel_cat_L*.npz and
# operational/web/data/catchments_L*.geojson + levels.json) must be committed once
# (run `python run.py --precompute` locally).
# Rain: OPERA 1-h accumulations are re-downloaded from EUMETNET's 24-h cache, so a
# late / skipped run loses nothing within OPERA coverage. The stores
# (opera_L*.csv, rv_L*.csv, rv_bias.json) are only a cache, kept between runs via
# the Actions cache; RainViewer gap-fill outside OPERA still needs runs < 2 h apart.

on:
  schedule:
    # ---- CADENCE: edit this one line freely ----
    #   hourly        = "17 * * * *"  (current; off minute 0, GitHub's busiest slot)
    #   every 30 min  = "*/30 * * * *"
    #   every 15 min  = "*/15 * * * *"
    # Inside OPERA coverage any cadence works (24-h server-side history).
    # Outside it (Greece, Ukraine, Turkey...) RainViewer serves only ~2 h, so keep
    # the interval < 2 h there; missing hours are shown as coverage < 1.
    # GitHub's schedule is best-effort (measured Nov-2026: fires every 4-8 h, not
    # hourly). The PRIMARY trigger is therefore the "chain" job below: each run
    # dispatches the next one at the next hh:14 UTC (OPERA's hh:00 hour is on the
    # server by then). This cron only restarts the chain if it ever breaks.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write                # lets the run dispatch the next one (self-chaining, see "chain")
  pages: write
  id-token: write

concurrency:
  group: nowcast-pages
  cancel-in-progress: false     # queue overlapping runs (external + backup trigger), never abort one mid-cycle

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: operational
        run: pip install -r requirements.txt

      # Key prefix MUST be identical in restore-keys and save key (the old
      # workflow restored "nowcast-store-v2-" but saved "nowcast-store-<id>",
      # so the store was never restored and every run started from scratch).
      - name: Restore rolling store
        uses: actions/cache/restore@v4
        with:
          path: |
            operational/state/opera_L*.csv
            operational/state/rv_L*.csv
            operational/state/rv_bias.json
          key: nowcast-store-v3-${{ github.run_id }}
          restore-keys: nowcast-store-v3-

      - name: Run one cycle
        working-directory: operational
        run: python run.py --once

      - name: Save rolling store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            operational/state/opera_L*.csv
            operational/state/rv_L*.csv
            operational/state/rv_bias.json
          key: nowcast-store-v3-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: operational/web
      - id: deploy
        uses: actions/deploy-pages@v4

  # Self-chaining hourly trigger. workflow_dispatch is one of the two events the
  # built-in GITHUB_TOKEN is allowed to trigger, so no PAT or external cron is
  # needed. Runs even if build-deploy failed, so one bad cycle can't stop the chain.
  chain:
    needs: build-deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      CHAIN_MINUTE: "14"        # start each cycle at hh:14 UTC
    steps:
      - name: Wait for the next slot, then dispatch the next run
        run: |
          now=$(date -u +%s)
          next=$(( now / 3600 * 3600 + CHAIN_MINUTE * 60 ))
          while [ "$next" -le $(( now + 120 )) ]; do next=$(( next + 3600 )); done
          echo "next run at $(date -u -d @$next +%H:%M) UTC (sleeping $(( (next - now) / 60 )) min)"
          sleep $(( next - now ))
          # Guard against duplicate chains: if another run of this workflow is
          # already queued/running (e.g. the backup cron), let that one carry on.
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow nowcast.yml -L 20                      --json databaseId,status                      --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and
                            (.status == \"queued\" or .status == \"in_progress\" or
                             .status == \"pending\" or .status == \"waiting\" or
                             .status == \"requested\"))] | length")
          if [ "$others" -gt 0 ]; then
            echo "another run is already queued/running ($others) - not dispatching"
          else
            gh workflow run nowcast.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
            echo "dispatched next cycle"
          fi
