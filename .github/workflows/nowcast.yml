name: nowcast

# Run one pipeline cycle and deploy the static site to GitHub Pages.
# Precompute artifacts (operational/state/attrs_L*.csv, pixel_cat_L*.npz and
# operational/web/data/catchments_L*.geojson + levels.json) must be committed once
# (run `python run.py --precompute` locally).
# Rain: OPERA 1-h accumulations are re-downloaded from EUMETNET's 24-h cache, so a
# late / skipped run loses nothing within OPERA coverage. The stores
# (opera_L*.csv, rv_L*.csv, rv_bias.json) are only a cache, kept between runs via
# the Actions cache; RainViewer gap-fill outside OPERA still needs runs < 2 h apart.

on:
  schedule:
    # ---- CADENCE: edit this one line freely ----
    #   hourly        = "17 * * * *"  (current; off minute 0, GitHub's busiest slot)
    #   every 30 min  = "*/30 * * * *"
    #   every 15 min  = "*/15 * * * *"
    # Inside OPERA coverage any cadence works (24-h server-side history).
    # Outside it (Greece, Ukraine, Turkey...) RainViewer serves only ~2 h, so keep
    # the interval < 2 h there; missing hours are shown as coverage < 1.
    # GitHub's schedule is best-effort (often 4-7 h gaps in practice), so the
    # primary trigger is an external hourly cron (cron-job.org) calling the
    # workflow_dispatch API; this schedule is only the backup.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nowcast-pages
  cancel-in-progress: false     # queue overlapping runs (external + backup trigger), never abort one mid-cycle

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: operational
        run: pip install -r requirements.txt

      # Key prefix MUST be identical in restore-keys and save key (the old
      # workflow restored "nowcast-store-v2-" but saved "nowcast-store-<id>",
      # so the store was never restored and every run started from scratch).
      - name: Restore rolling store
        uses: actions/cache/restore@v4
        with:
          path: |
            operational/state/opera_L*.csv
            operational/state/rv_L*.csv
            operational/state/rv_bias.json
          key: nowcast-store-v3-${{ github.run_id }}
          restore-keys: nowcast-store-v3-

      - name: Run one cycle
        working-directory: operational
        run: python run.py --once

      - name: Save rolling store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            operational/state/opera_L*.csv
            operational/state/rv_L*.csv
            operational/state/rv_bias.json
          key: nowcast-store-v3-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: operational/web
      - id: deploy
        uses: actions/deploy-pages@v4
